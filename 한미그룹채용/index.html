<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한미그룹 2026년 하반기 공개채용</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    /* =========================================================
       Design Tokens
       ========================================================= */
    :root {
      --color-black: #000000;
      --color-white: #FFFFFF;
      --color-red: #E60012;
      --color-orange: #FF5D32;
      --color-white-10: rgba(255, 255, 255, 0.1);
      --color-white-50: rgba(255, 255, 255, 0.5);

      --font-base: 'Inter', 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;

      --page-max: 1920px;   /* 전체 페이지 기준 */
      --inner-max: 1440px;  /* 내용 컨테이너 기준 */
      --header-h: 100px;
      --transition: 0.2s ease;
    }

    /* =========================================================
       Reset
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body, h1, h2, h3, p, ul, ol, li, figure { margin: 0; padding: 0; }
    ul, ol { list-style: none; }
    a { color: inherit; text-decoration: none; }
    img, svg { display: block; max-width: none; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

    body {
      font-family: var(--font-base);
      color: var(--color-black);
      background: var(--color-white);
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    a:focus-visible, button:focus-visible {
      outline: 3px solid var(--color-red);
      outline-offset: 3px;
    }

    /* =========================================================
       Common : Layout (main 1920px / inner 1440px)
       ========================================================= */
    main {
      width: 100%;
      max-width: var(--page-max);
      margin: 0 auto;
    }
    .inner {
      position: relative;
      width: 100%;
      max-width: var(--inner-max);
      margin: 0 auto;
    }

    /* =========================================================
       Common : Buttons (hover → 흰색/빨간색 반전)
       ========================================================= */
    .btn {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 500px;
      color: var(--color-white);
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      box-shadow: inset 0 0 0 0 var(--color-red);
      transition: color var(--transition), box-shadow var(--transition), background-color var(--transition);
    }
    .btn::before {            /* 반전용 흰색 레이어 */
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--color-white);
      opacity: 0;
      transition: opacity var(--transition);
    }
    .btn:hover,
    .btn:focus-visible {
      color: var(--color-red);
      box-shadow: inset 0 0 0 2px var(--color-red);
    }
    .btn:hover::before,
    .btn:focus-visible::before { opacity: 1; }

    /* 지원하기 (헤더 CTA) */
    .btn--apply {
      gap: 10px;
      width: 119px;
      height: 48px;
      padding: 13.5px 20px 14.5px;
      background: var(--color-red);
      font-size: 17.4px;
      line-height: 18px;
      letter-spacing: -0.36px;
    }
    .btn--apply .ico-chevron-right { width: 7px; height: 12px; }
    .btn--apply .ico-chevron-right path { stroke: currentColor; transition: stroke var(--transition); }

    /* 모집직무 바로가기! (메인 CTA) */
    .btn--primary {
      width: 303px;
      max-width: 303px;
      height: 72px;
      padding: 18.7px 64px 19.3px;
      background: linear-gradient(90deg, var(--color-red) 0%, var(--color-orange) 100%);
      font-size: 22.7px;
      line-height: 34px;
      letter-spacing: -0.48px;
    }

    /* =========================================================
       Header
       ========================================================= */
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      height: var(--header-h);
    }
    header .inner {
      height: 100%;
      padding: 0 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { display: block; width: 182px; height: 31px; }
    .logo img { width: 182px; height: 31px; }

    .gnb { display: flex; align-items: center; height: 100%; }
    .gnb__list { display: flex; align-items: center; gap: 40px; height: 100%; }
    .gnb__item { display: flex; align-items: center; height: 100%; }
    .gnb__link {
      font-size: 19.1px;
      line-height: 20px;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: var(--color-black);
      transition: color var(--transition);
    }
    .gnb__link:hover,
    .gnb__link:focus-visible { color: var(--color-red); }

    /* =========================================================
       Main Visual (section)
       ========================================================= */
    .mv {
      position: relative;
      width: 100%;
      height: 900px;
      min-height: 720px;
      background: url("./images/mv_bg_png.png") center / cover no-repeat;
      overflow: hidden;
    }
    .mv .inner { height: 100%; }

    /* ---- 텍스트 영역 (Flex) ---- */
    .mv__content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding-left: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 80px;
      width: 660px;
    }
    .mv__text { display: flex; flex-direction: column; align-items: flex-start; gap: 31.9px; width: 442px; }
    .mv__eyebrow {
      font-size: 31.1px;
      line-height: 45px;
      font-weight: 700;
      letter-spacing: -0.64px;
    }
    .mv__title { display: flex; flex-direction: column; align-items: flex-start; }
    .mv__title-em {
      font-size: 72.3px;
      line-height: 76px;
      font-weight: 800;
      letter-spacing: -1.76px;
      white-space: nowrap;
    }
    .mv__title-sub {
      font-size: 45.8px;
      line-height: 72px;
      font-weight: 800;
      letter-spacing: -1.12px;
      white-space: nowrap;
    }
    .mv__period {
      font-size: 19.2px;
      line-height: 28px;
      font-weight: 500;
      letter-spacing: -0.4px;
      white-space: nowrap;
    }

    /* ---- 비주얼 영역 (원형 + 캐릭터 + 별) ---- */
    .mv__visual {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .mv__visual > * { position: absolute; }

    /* 원형 링 : 별도 요소 없이 가상요소로 구현 (캐릭터 뒤에 위치) */
    .mv__visual::before,
    .mv__visual::after {
      content: "";
      position: absolute;
      border-radius: 500px;
    }
    .mv__visual::before {      /* blur 링 */
      z-index: -2;
      left: 700px; top: 118px;
      width: 663px; height: 663px;
      border: 5px solid var(--color-white);
      background: radial-gradient(70.71% 70.71% at 50% 50%, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 100%);
      filter: blur(5px);
    }
    .mv__visual::after {       /* line 링 */
      z-index: -1;
      left: 755px; top: 173px;
      width: 553px; height: 553px;
      border: 1px solid var(--color-white-50);
    }

    .mv__img { height: auto; }
    .mv__img--micro  { left: 766px;  top: 152px; width: 289.52px; height: 221.76px; }
    .mv__img--char1  { left: 815px;  top: 295px; width: 253.44px; height: 395.12px; }  /* 파랑 */
    .mv__img--char2  { left: 1037px; top: 293px; width: 181.28px; height: 381.04px; }  /* 주황 */
    .mv__img--char3  { left: 739px;  top: 469px; width: 216.48px; height: 262.24px; }  /* 보라 */
    .mv__img--char4  { left: 1096px; top: 490px; width: 292.16px; height: 206.8px; }   /* 노랑 */

    .mv__star--1 { left: 922px;  top: 237px; width: 17.6px;  height: 16.72px; }
    .mv__star--2 { left: 740px;  top: 469px; width: 22.88px; height: 23.76px; }
    .mv__star--3 { left: 1315px; top: 475px; width: 21.12px; height: 21.12px; }
    .mv__star--4 { left: 1161px; top: 249px; width: 23.76px; height: 24.64px; }
    .mv__star--5 { left: 1333px; top: 432px; width: 34.32px; height: 35.2px; }

    /* ---- 스크롤 버튼 ---- */
    .mv__scroll {
      position: absolute;
      left: 50%;
      bottom: 64px;
      z-index: 3;
      transform: translateX(-50%);
      width: 80px; height: 80px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 500px;
      background: var(--color-white-10);
      box-shadow: inset 4px 4px 10px rgba(255, 255, 255, 0.4), inset -4px -4px 10px rgba(0, 0, 0, 0.1);
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
      transition: background-color var(--transition), box-shadow var(--transition);
    }
    .mv__scroll::before {      /* Gradient + Border */
      content: "";
      position: absolute; inset: 0;
      border-radius: 500px;
      background: linear-gradient(132.3deg, rgba(255, 255, 255, 0.8) 12.7%, rgba(255, 255, 255, 0) 86.3%);
      opacity: 0.35;
      transition: opacity var(--transition);
    }
    .mv__scroll svg { position: relative; width: 40px; height: 40px; }
    .mv__scroll svg path { stroke: var(--color-white); transition: stroke var(--transition); }
    .mv__scroll:hover,
    .mv__scroll:focus-visible { background-color: var(--color-red); }
    .mv__scroll:hover::before,
    .mv__scroll:focus-visible::before { opacity: 0; }

    /* =========================================================
       Footer (시안 없음 : 화면에 보이지 않는 빈 영역)
       ========================================================= */
    footer { height: 0; overflow: hidden; }

    /* ---- 1440px 미만: 내용 영역 축소 대응 ---- */
    @media (max-width: 1439px) {
      .mv__visual { transform-origin: left top; }
    }
    @media (max-width: 1100px) {
      .gnb__list { gap: 0; }
      .gnb__item:not(.gnb__item--cta) { display: none; }
      .mv__visual { display: none; }
      .mv__content { width: 100%; padding: 0 24px; }
      .mv__text { width: 100%; }
      .mv__title-em { font-size: 56px; line-height: 60px; }
      .mv__title-sub { font-size: 36px; }
      .mv__period { white-space: normal; font-size: 16px; }
      header .inner { padding: 0 24px; }
    }
  </style>
</head>
<body>

  <!-- ================= Header ================= -->
  <header>
    <div class="inner">
      <a class="logo" href="#" aria-label="한미그룹 홈">
        <img src="./images/logo_svg.svg" alt="Hanmi 한미그룹" width="182" height="31">
      </a>

      <nav class="gnb" aria-label="주요 메뉴">
        <ul class="gnb__list">
          <li class="gnb__item"><a class="gnb__link" href="#jobs">직무소개</a></li>
          <li class="gnb__item"><a class="gnb__link" href="#qualification">지원자격 및 접수방법</a></li>
          <li class="gnb__item"><a class="gnb__link" href="#schedule">채용설명회 일정</a></li>
          <li class="gnb__item gnb__item--cta">
            <a class="btn btn--apply" href="#apply">
              <span>지원하기</span>
              <svg class="ico-chevron-right" viewBox="0 0 7 12" fill="none" aria-hidden="true">
                <path d="M1 1l5 5-5 5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ================= Main ================= -->
  <main>
    <section class="mv" id="main-visual" aria-labelledby="mv-title">
      <div class="inner">

        <!-- 텍스트 영역 -->
        <div class="mv__content">
          <div class="mv__text">
            <p class="mv__eyebrow">2026년 하반기</p>
            <h1 class="mv__title" id="mv-title">
              <span class="mv__title-em">한미그룹</span>
              <span class="mv__title-sub">공개채용</span>
            </h1>
            <p class="mv__period">모집기간 : 2026.9.28(월) ~ 2026.10.18(일) 23:59까지</p>
          </div>
          <a class="btn btn--primary" href="#jobs">모집직무 바로가기!</a>
        </div>

        <!-- 비주얼 영역 (장식 요소 : 원형 링은 CSS 가상요소) -->
        <!-- Container.png : 현미경 / Container-1.png : 파랑 / Container-2.png : 주황 / mv_char3_png.png : 보라 / Container-3.png : 노랑 -->
        <div class="mv__visual" aria-hidden="true">
          <img class="mv__img mv__img--micro" src="./images/Container.png"    alt="">
          <img class="mv__img mv__img--char1" src="./images/Container-1.png"  alt="">
          <img class="mv__img mv__img--char2" src="./images/Container-2.png"  alt="">
          <img class="mv__img mv__img--char3" src="./images/mv_char3_png.png" alt="">
          <img class="mv__img mv__img--char4" src="./images/Container-3.png"  alt="">

          <svg class="mv__star--1" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFFFFF" d="M12 0c.8 7.5 4.5 11.2 12 12-7.5.8-11.2 4.5-12 12-.8-7.5-4.5-11.2-12-12 7.5-.8 11.2-4.5 12-12z"/></svg>
          <svg class="mv__star--2" viewBox="0 0 24 24" aria-hidden="true"><path fill="#A56BFF" d="M12 0c.8 7.5 4.5 11.2 12 12-7.5.8-11.2 4.5-12 12-.8-7.5-4.5-11.2-12-12 7.5-.8 11.2-4.5 12-12z"/></svg>
          <svg class="mv__star--3" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFC928" d="M12 0c.8 7.5 4.5 11.2 12 12-7.5.8-11.2 4.5-12 12-.8-7.5-4.5-11.2-12-12 7.5-.8 11.2-4.5 12-12z"/></svg>
          <svg class="mv__star--4" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF5D32" d="M12 0c.8 7.5 4.5 11.2 12 12-7.5.8-11.2 4.5-12 12-.8-7.5-4.5-11.2-12-12 7.5-.8 11.2-4.5 12-12z"/></svg>
          <svg class="mv__star--5" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFC928" d="M12 0c.8 7.5 4.5 11.2 12 12-7.5.8-11.2 4.5-12 12-.8-7.5-4.5-11.2-12-12 7.5-.8 11.2-4.5 12-12z"/></svg>
        </div>

        <!-- 아래로 스크롤 버튼 -->
        <button class="mv__scroll" type="button" aria-label="아래로 스크롤">
          <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <path d="M10 15l10 10 10-10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

      </div>
    </section>
  </main>

  <!-- ================= Footer (시안 없음) ================= -->
  <footer></footer>

  <script>
    (function () {
      'use strict';

      // 아래로 스크롤 버튼: 메인 비주얼 높이만큼 부드럽게 이동
      var scrollBtn = document.querySelector('.mv__scroll');
      var mv = document.querySelector('.mv');
      if (scrollBtn && mv) {
        scrollBtn.addEventListener('click', function () {
          window.scrollTo({ top: mv.offsetHeight, behavior: 'smooth' });
        });
      }
    })();
  </script>
</body>
</html>
