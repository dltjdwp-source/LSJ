<!doctype html>
<html>
  <head>
    <title>산리오 코리아</title>
    <meta charset="UTF-8" />
    <!-- 인터널스타일시트(internal style sheet) -->
    <!-- 상단영역 스타일 (Top Area Styles) -->
    <style>
      /* 웹폰트 로딩하기(CDN방식)
        CDN은 Content Delivery Networt 즉, 네트워크 망으로 컨텐트를 배탈시켜 쓰는 방식 */

      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nanum+Gothic&display=swap");

      @import url("https://cdn.jsdelivr.net/gh/moonspam/NanumBarunGothic@1.0/nanumbarungothicsubset.css");

      /* 전체 루트 설정 */
      html {
        /* rem단위를 위한 Root 글자크기설정 */
        font-size: 10px;
        /* 왜 10px인가? rem단위에 계산이 용이함! */
      }
      html,body {
        /* 웹폰트 */
        font-family: Montserrat, "Nanum Barun Gothic", AppleGothic, Dotum, sans-serif;
      }
      /* 공통요소 초기화 */
      html, body, div, span, applet, object, iframe,
      h1, h2, h3, h4, h5, h6, p, blockquote, pre,
      a, abbr, acronym, address, big, cite, code,
      del, dfn, em, img, ins, kbd, q, s, samp,
      small, strike, strong, sub, sup, tt, var,
      b, u, i, center,
      dl, dt, dd, ol, ul, li,
      fieldset, form, label, legend,
      table, caption, tbody, tfoot, thead, tr, th, td,
      article, aside, canvas, details, embed, 
      figure, figcaption, footer, header, hgroup, 
      menu, nav, output, ruby, section, summary,
      time, mark, audio, video {
        margin: 0;
        padding: 0;
      }

      .top-inner {
        max-width: 1440px; /* 최대 너비 지정 */
        margin: 0 auto; /* 가운데 정렬 */
        display: flex; /* 가로 레이아웃을 위한 flex 사용 */
        align-items: center; /* 세로 중앙 정렬 */
        justify-content: space-between; /* 양끝 정렬 */
        height: 90px; /* 높이 지정 */
      }
      .logo-box {
        flex: 0 0 auto; /* 크기가 고정된 flex 아이템 */
      }
      .logo-box img {
        height: 56px; /* 로고 이미지 높이 고정 */
      }
      .menu-list {
        flex: 0 0 auto; /* 크기 고정 */
        display: flex; /* 가로로 나열 */
        gap: 48px; /* 메뉴 아이템 간 간격 */
        list-style: none; /* 기본 리스트 마커 제거 */
        padding: 0; /* 패딩 제거 */
        margin: 0; /* 마진 제거 */
        font-size: 1.6rem; /* 폰트 크기 */
      }
      .menu-list li a {
        color: inherit; /* 글자색 상속 */
        text-decoration: none; /* 밑줄 제거 */
        text-transform: uppercase; /* 대문자 변환 */
      }
      /* 배너영역 스타일 */
      .banner-real {
        position: relative;
        padding: 80px;
        background: url("./images/main_visual_bg.jpg") repeat 0 0/50px;
        /* 배경스타일 사용법:
        background: 색 이 반 고 윙/크
        background: 배경색 이미지 반복 고정 위치/크기 */
      }
      .banner-real .center-banner {
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .banner-real .main-visual-img {
        /* display: block; */
        width: 984px;
        max-width: 100%;
      }
      .sns {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 50px;
        right: 50px;
      }
    </style>
  </head>
  <body>
    <main class="wrapper">
      <!-- 1. 상단영역 -->
      <header class="top-real">
        <!-- 상단영역 내용 -->
        <div class="top-inner">
          <!-- 로고이미지박스 (왼쪽 끝) -->
          <div class="logo-box">
            <img src="./images/logo_2023.png" alt="산리오코리아 로고" />
          </div>
          <!-- 메뉴리스트 (오른쪽 끝) -->
          <nav>
            <ul class="menu-list">
              <li><a href="#company">company</a></li>
              <li><a href="#character">character</a></li>
              <li><a href="#place">place</a></li>
              <li><a href="#recruit">recruit</a></li>
            </ul>
          </nav>
        </div>
      </header>
      <!-- 2. 메인영역 -->
      <section class="main-real">
        <!-- 2-1. 배너영역 -->
        <section class="banner-real">
          <!-- 배너영역 내용 -->
          <div class="center-banner">
            <img
              src="./images/main_visual_pc_v1.png"
              alt="메인 비주얼"
              class="main-visual-img"
            />
          </div>
          <!-- SNS이동버튼박스 -->
          <div class="sns">
            <a href="https://www.instagram.com/sanrio_kr/" target="_blank">
              <img src="./images/i_ins_pc_v3.png" alt="인스타그램"
            /></a>
            <a
              href="https://www.youtube.com/c/sanriokorea/featured"
              target="_blank"
            >
              <img src="./images/i_you_pc_v3.png" alt="유튜브"
            /></a>
          </div>
          <!-- 스크롤 유도 애니박스 -->
          <div class="scroll_btn">
            <span class="mouse"><span></span></span>
            <p>scroll down</p>
          </div>
        </section>
        <!-- 2-2. 캐릭터영역 -->
        <section class="character-real">캐릭터영역 내용</section>
        <!-- 2-3. 컴퍼니영역 -->
        <section class="company-real">컴퍼니영역 내용</section>
        <!-- 2-4. 리쿠르트영역 -->
        <section class="recruit-real">리쿠르트영역 내용</section>
        <!-- 2-5. 플레이스영역 -->
        <section class="place-real">플레이스영역 내용</section>
        <!-- 2-6. 컨텍어스영역 -->
        <section class="contactus-real">컨텍어스영역 내용</section>
      </section>
      <!-- 3. 하단영역 -->
      <footer class="bottom-real">하단영역 내용</footer>
    </main>
  </body>
</html>
